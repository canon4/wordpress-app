name: Deploy de la imagen

# Publica wordpress-app como imagen Docker completa (WordPress core + plugins
# propios) en GHCR y la despliega en producción. El tema NO viaja aquí — lo
# publica su propio pipeline (amazonia-theme/deploy.yml) vía rsync a un volumen.
on:
  push:
    branches:
      - master
    # Cambios que no afectan la imagen construida no deben recrear el
    # contenedor en producción (implica un corte breve, ver docs). Lista de
    # bloqueo, no de permiso: ante la duda, se prefiere un deploy de más a
    # perderse uno real por un patrón mal escrito.
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'entregables/**'
      - '.claude/**'
      - '.github/**/*.md'
      - 'readme.html'
      - 'license.txt'
      - 'backup-local.ps1'
      - '.gitignore'
      - '.gitattributes'
  workflow_dispatch: {}

concurrency:
  group: deploy-imagen-produccion
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/canon4/wordpress-app

permissions:
  contents: read
  packages: write

jobs:
  build:
    name: Build y publicar en GHCR
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Calcular el tag de esta imagen
        id: meta
        run: echo "tag=sha-$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Build y push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ steps.meta.outputs.tag }}
            ${{ env.IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Publicar en producción
    needs: build
    runs-on: ubuntu-latest
    environment: production
    steps:
      # Dokploy gestiona el servidor (compose, volúmenes, red) desde su propio
      # dashboard. GitHub Actions ya no toca el host por SSH: solo avisa a
      # Dokploy, vía su webhook de redeploy, de que hay imagen nueva en GHCR.
      # El "Auto Deploy" / trigger de git en Dokploy debe estar APAGADO — si
      # Dokploy escuchara el push directamente, dispararía antes de que este
      # job termine de subir la imagen a GHCR.
      - name: Disparar redeploy en Dokploy
        run: |
          curl -fsS -X POST "${{ secrets.DOKPLOY_DEPLOY_WEBHOOK }}"

      - name: Esperar a que Dokploy aplique el cambio
        run: sleep 20

      - name: Smoke test
        run: |
          set -euo pipefail
          html=''
          for intento in 1 2 3 4 5; do
            if html=$(curl -fsS --max-time 20 "${{ secrets.SITE_URL }}"); then break; fi
            echo "Intento $intento falló, reintentando en 10 s..."
            sleep 10
          done
          if [ -z "$html" ]; then
            echo "::error::El sitio no respondió tras 5 intentos."
            exit 1
          fi
          # Comparación nativa de bash — nunca "printf | grep -q" bajo pipefail
          # (falso negativo por SIGPIPE, ver amazonia-theme/docs/08_cicd_despliegue.md).
          if [[ "$html" == *"Error establishing a database connection"* ]]; then
            echo "::error::El sitio responde pero no puede conectar a la base de datos."
            exit 1
          fi
          echo "Smoke test OK."
